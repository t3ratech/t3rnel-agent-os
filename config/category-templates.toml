# Agent Category Templates Configuration
# This file defines default fallback chains, models, providers, and retry backoff
# settings for each agent category in T3rnel.
#
# ORDERING: tier-first, provider-interleaved. Each capability tier lists the same
# model class across several providers (e.g. GLM 5.2 via OpenRouter -> NVIDIA ->
# Cloudflare -> MorphLLM) before dropping to a weaker tier. A single provider
# outage or rate limit therefore costs latency, not answer quality.
#
# Every model ID below was validated against the provider's live /models endpoint.
# Do not add an ID without checking it first — an unknown ID costs a full request
# round-trip and a 404 before the chain can move on.
#
# Known provider caveats at time of writing:
#   - cerebras : key returns `payment_required`; entries are kept so the chain
#                recovers automatically once billing is restored.
#   - gemini   : key returns `CONSUMER_SUSPENDED`; IDs mirror the google/* family
#                OpenRouter exposes and could not be probed directly.
#   - video    : no configured provider serves text-to-video today. The
#                video_generation chain falls back to image + creative text models.

# Retry backoff profiles
[retry_backoff]
model = "exponential"
model_max_attempts = 3
model_min_delay_ms = 1000
model_max_delay_ms = 60000
model_jitter = 0.2

provider = "exponential"
provider_max_attempts = 5
provider_min_delay_ms = 2000
provider_max_delay_ms = 300000
provider_jitter = 0.3

email = "fixed_delay"
email_max_attempts = 10
email_min_delay_ms = 60000
email_max_delay_ms = 172800000
email_jitter = 0.1

generic = "exponential"
generic_max_attempts = 3
generic_min_delay_ms = 500
generic_max_delay_ms = 10000
generic_jitter = 0.2

###############################################################################
# Category-specific fallback chains (tier-first, provider-interleaved)
###############################################################################


###############################################################################
# Provider catalog (drives the UI model dropdowns)
###############################################################################

