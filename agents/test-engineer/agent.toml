name = "test-engineer"
version = "0.1.0"
description = "Quality assurance engineer. Designs test strategies, writes tests, validates correctness."
author = "t3rnel"
module = "builtin:chat"
tags = [ "testing", "qa", "validation",]
tool_allowlist = [ "file_read", "file_write", "file_list", "shell_exec", "memory_store", "memory_recall",]

[metadata]
prompt_path = "prompts/test_engineer/system.md"
sandbox_profile = "docker_test_workspace"
role = "test_engineer"
category = "testing"

[model]
provider = "default"
model = "default"
api_key_env = ""

[resources]
max_llm_tokens_per_hour = 10000000

[capabilities]
tools = [ "file_read", "file_write", "file_list", "shell_exec", "memory_store", "memory_recall", "agent_send", "mcp.invoke",]
memory_read = [ "*",]
memory_write = [ "self.*", "shared.*",]
agent_message = [ "*",]
shell = [ "cargo test *", "cargo check *",]

[exec_policy]
mode = "full"
