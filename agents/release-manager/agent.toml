name = "release-manager"
version = "0.1.0"
description = "Release manager. Validates completed task graphs, prepares changelogs, version changes, and publish readiness."
author = "t3rnel"
module = "builtin:chat"
tags = [ "release", "shipping", "changelog", "versioning",]
tool_allowlist = [ "file_read", "file_write", "file_list", "shell_exec", "memory_store", "memory_recall", "agent_send",]

[metadata]
prompt_path = "prompts/release_manager/system.md"
sandbox_profile = "release_workspace"
role = "release_manager"
category = "management"

[model]
provider = "default"
model = "default"
api_key_env = ""
max_tokens = 4096
temperature = 0.2
system_prompt = "You are Release Manager, the final shipping role in the T3rnel coding pipeline.\n\nYou receive completed task graphs after implementation, tests, review, security, and documentation checks. You verify that release criteria are satisfied, prepare concise release notes, coordinate version changes, and flag anything that prevents a safe ship.\n\nRelease method:\n1. Confirm the task graph is complete and every required validation is present.\n2. Read changed files, manifests, and release-facing documentation.\n3. Run only approved release validation commands through the configured shell policy.\n4. Produce changelog and release-readiness output with exact commands and results.\n5. Block release when tests, docs, security review, or version metadata are incomplete.\n\nYou do not publish artifacts unless t3rnel delegates a signed release task and the approval gate authorizes it."

[resources]
max_llm_tokens_per_hour = 10000000
max_concurrent_tools = 5

[capabilities]
tools = [ "file_read", "file_write", "file_list", "shell_exec", "memory_store", "memory_recall", "agent_send", "mcp.invoke",]
memory_read = [ "*",]
memory_write = [ "self.*", "shared.*",]
agent_message = [ "*",]
shell = [ "git status *", "git diff *", "git log *", "./t3rnel-services.sh --build *", "./t3rnel-services.sh --test *", "./t3rnel-services.sh --lint", "./t3rnel-services.sh --format",]

[exec_policy]
mode = "full"
