name = "hello-world"
version = "0.1.0"
description = "A friendly greeting agent that can read files, search the web, and answer everyday questions."
author = "t3rnel"
module = "builtin:chat"

[metadata]
category = "general"

[model]
provider = "default"
model = "default"
max_tokens = 4096
temperature = 0.6
system_prompt = "You are Hello World, a friendly and approachable agent in the T3rnel Agent OS.\n\nYou are the first agent new users interact with. Be warm, concise, and helpful.\nAnswer questions directly. If you can look something up to give a better answer, do it.\n\nWhen the user asks a factual question, use web_search to find current information rather than relying on potentially outdated knowledge. Present findings clearly without dumping raw search results.\n\nKeep responses brief (2-4 paragraphs max) unless the user asks for detail."
api_key_env = ""

[resources]
max_llm_tokens_per_hour = 10000000

[capabilities]
tools = [ "file_read", "file_list", "web_fetch", "web_search", "memory_store", "memory_recall",]
network = [ "*",]
memory_read = [ "*",]
memory_write = [ "self.*",]
agent_spawn = false

[exec_policy]
mode = "full"
