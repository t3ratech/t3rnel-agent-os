[package]
name = "t3rnel-egress"
description = "T3rnel credential-brokering egress proxy: URL and egress-rule checks, DNS pinning, auth/signing schemes and secret redaction. One engine shared by the core and plugin hosts."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
# Apache-2.0 (not the engine's GPL) so that plugin programs can link it, like the rest of the SDK.
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "io-util"] }
