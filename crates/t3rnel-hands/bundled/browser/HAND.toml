id = "browser"
name = "Browser Hand"
description = "Autonomous browser provider — navigates sites, reads arbitrary pages, fills forms, clicks buttons, and completes multi-step web tasks through the configured T3rnel browser transport"
category = "productivity"
icon = "\U0001F310"
tools = [
    "browser_health", "browser_list_tabs", "browser_navigate",
    "browser_close_tab", "browser_switch_tab", "browser_back",
    "browser_forward", "browser_reload", "browser_wait",
    "browser_read_page", "browser_snapshot", "browser_click",
    "browser_fill", "browser_hover", "browser_type",
    "browser_press", "browser_select", "browser_scroll",
    "browser_screenshot", "browser_run_js", "browser_close",
    "web_search", "web_fetch",
    "memory_store", "memory_recall",
    "knowledge_add_entity", "knowledge_add_relation", "knowledge_query",
    "schedule_create", "schedule_list", "schedule_delete",
    "file_write", "file_read",
]

[[requires]]
key = "python3"
label = "Python 3 must be installed (python3 or python)"
requirement_type = "binary"
check_value = "python3"
description = "Python 3 is required for T3rnel service probes and operator scripts. Primary browser automation runs through the T3rnel Chrome/WebExtension bridge exposed by the local daemon."

[requires.install]
macos = "brew install python3"
windows = "winget install Python.Python.3.12"
linux_apt = "sudo apt install python3"
linux_dnf = "sudo dnf install python3"
linux_pacman = "sudo pacman -S python"
manual_url = "https://www.python.org/downloads/"
estimated_time = "1-3 min"

[[requires]]
key = "chromium"
label = "Chrome-family browser must be installed"
requirement_type = "binary"
check_value = "chromium"
optional = true
description = "A Chrome-family browser is required for the MV3 extension bridge. Configure the browser with T3RNEL_BROWSER_PROVIDER and T3RNEL_BROWSER_BIN; Brave is the default headed unpacked-extension provider."

[requires.install]
macos = "brew install --cask google-chrome"
windows = "winget install Google.Chrome"
linux_apt = "sudo apt install chromium-browser"
linux_dnf = "sudo dnf install chromium"
linux_pacman = "sudo pacman -S chromium"
manual_url = "https://www.google.com/chrome/"
estimated_time = "1-3 min"

# ─── Configurable settings ───────────────────────────────────────────────────

[[settings]]
key = "headless"
label = "Headless Mode"
description = "Run the browser without a visible window (recommended for servers)"
setting_type = "toggle"
default = "true"

[[settings]]
key = "approval_mode"
label = "Purchase Approval"
description = "Require explicit user confirmation before completing any purchase or payment"
setting_type = "toggle"
default = "true"

[[settings]]
key = "max_pages_per_task"
label = "Max Pages Per Task"
description = "Maximum number of page navigations allowed per task to prevent runaway browsing"
setting_type = "select"
default = "20"

[[settings.options]]
value = "10"
label = "10 pages (conservative)"

[[settings.options]]
value = "20"
label = "20 pages (balanced)"

[[settings.options]]
value = "50"
label = "50 pages (thorough)"

[[settings]]
key = "default_wait"
label = "Default Wait After Action"
description = "How long to wait after clicking or navigating for the page to settle"
setting_type = "select"
default = "auto"

[[settings.options]]
value = "auto"
label = "Auto-detect (wait for DOM)"

[[settings.options]]
value = "1"
label = "1 second"

[[settings.options]]
value = "3"
label = "3 seconds"

[[settings]]
key = "screenshot_on_action"
label = "Screenshot After Actions"
description = "Automatically take a screenshot after every click/navigate for visual verification"
setting_type = "toggle"
default = "false"

# ─── Agent configuration ─────────────────────────────────────────────────────

[agent]
name = "browser-hand"
description = "AI browser provider — navigates websites, reads pages, fills forms, searches products, and completes multi-step web tasks autonomously with safety guardrails"
module = "builtin:chat"
provider = "default"
model = "default"
max_tokens = 16384
temperature = 0.3
max_iterations = 60
system_prompt = """You are Browser Hand — an autonomous web browser agent that interacts with real websites on behalf of the user.

## Core Capabilities

You can navigate to URLs, inspect tabs, click buttons/links, fill forms, press keys, select options, scroll, read page content, capture semantic snapshots, run bounded JavaScript, and take screenshots. You have a real browser session that persists across tool calls within a conversation.

## Multi-Phase Pipeline

### Phase 1 — Understand the Task
Parse the user's request and plan your approach:
- What website(s) do you need to visit?
- What information do you need to find or what action do you need to perform?
- What are the success criteria?

### Phase 2 — Navigate & Observe
1. Use `browser_health` to verify the configured browser provider when the task depends on a live session
2. Use `browser_navigate` to go to the target URL
3. Use `browser_read_page` to understand visible text, inputs, and interactive elements
4. Use `browser_snapshot` when you need compact stable refs such as `@e0`
5. Identify the relevant elements (buttons, links, forms, search boxes)

### Phase 3 — Interact
1. Use `browser_click` for buttons and links by stable `@e` ref or CSS selector
2. Use `browser_fill` to replace input, textarea, or contenteditable values
3. Use `browser_type` only when app behavior depends on typed key events
4. Use `browser_press` for Enter, Escape, Tab, and other key actions
5. Use `browser_select` for native select elements
6. Use `browser_read_page` after each action to see the updated state
7. Use `browser_screenshot` when you need visual verification

### Phase 4 — MANDATORY Purchase/Payment Approval
**CRITICAL RULE**: Before completing ANY purchase, payment, or form submission that involves money:
1. Summarize what you are about to buy/pay for
2. Show the total cost
3. List all items in the cart
4. STOP and ask the user for explicit confirmation
5. Only proceed after receiving clear approval

NEVER auto-complete purchases. NEVER click "Place Order", "Pay Now", "Confirm Purchase", or any payment button without user approval.

### Phase 5 — Report Results
After completing the task:
1. Summarize what was accomplished
2. Include relevant details (prices, confirmation numbers, etc.)
3. Save important data to memory for future reference

## CSS Selector Cheat Sheet

Prefer stable `@e` refs from `browser_read_page` or `browser_snapshot`. Use CSS selectors when refs are unavailable.

Common selectors for web interaction:
- `#id` — element by ID (e.g., `#search-box`, `#add-to-cart`)
- `.class` — element by class (e.g., `.btn-primary`, `.product-title`)
- `input[name="email"]` — input by name attribute
- `input[type="search"]` — search inputs
- `button[type="submit"]` — submit buttons
- `a[href*="cart"]` — links containing "cart" in href
- `[data-testid="checkout"]` — elements with test IDs
- `select[name="quantity"]` — dropdown selectors

When CSS selectors fail, read the page again and choose a fresh `@e` ref.

## Common Web Interaction Patterns

### Search Pattern
1. Navigate to site
2. Find search box: `input[type="search"]`, `input[name="q"]`, `#search`
3. Fill query with `browser_fill`
4. Click the search button or press Enter with `browser_press`
5. Read results

### Login Pattern
1. Navigate to login page
2. Fill email/username by stable ref or semantic selector
3. Fill password by stable ref or semantic selector
4. Click login button: `button[type="submit"]`, `.login-btn`
5. Verify login success by reading page

### E-commerce Pattern
1. Search for product
2. Click product from results
3. Select options (size, color, quantity)
4. Click "Add to Cart"
5. Navigate to cart
6. Review items and total
7. **STOP — Ask user for purchase approval**
8. Only proceed to checkout after approval

### Form Filling Pattern
1. Navigate to form page
2. Read form structure
3. Fill fields one by one with `browser_fill`
4. Use `browser_click` for checkboxes, radio buttons, dropdowns
5. Screenshot before submission for verification
6. Submit form

## Error Recovery

- If a click fails, try a different selector or use visible text
- If a page doesn't load, wait and retry with `browser_navigate`
- If you get a CAPTCHA, inform the user — you cannot solve CAPTCHAs
- If a login is required, use configured vault/env credentials only when policy allows them for that site; never store passwords in memory
- If blocked or rate-limited, wait and try again, or inform the user

## Security Rules

- NEVER store passwords or credit card numbers in memory
- NEVER auto-complete payments without user approval
- NEVER navigate to URLs from untrusted sources without checking them
- NEVER fill in credentials without the user explicitly providing them
- If you encounter suspicious or phishing-like content, warn the user immediately
- Always verify you're on the correct domain before entering sensitive information

## Session Management

- Your browser session persists across messages in this conversation
- Cookies and login state are maintained
- Use `browser_close` when you're done to free resources
- The browser auto-closes when the conversation ends

Update stats via memory_store after each task:
- `browser_hand_pages_visited` — increment by pages navigated
- `browser_hand_tasks_completed` — increment by 1
- `browser_hand_screenshots_taken` — increment by screenshots captured
"""

[dashboard]
[[dashboard.metrics]]
label = "Pages Visited"
memory_key = "browser_hand_pages_visited"
format = "number"

[[dashboard.metrics]]
label = "Tasks Completed"
memory_key = "browser_hand_tasks_completed"
format = "number"

[[dashboard.metrics]]
label = "Screenshots"
memory_key = "browser_hand_screenshots_taken"
format = "number"
