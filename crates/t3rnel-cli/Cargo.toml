[package]
name = "t3rnel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for the T3rnel Agent OS"

[[bin]]
name = "t3rnel"
path = "src/main.rs"

[dependencies]
t3rnel-types = { path = "../t3rnel-types" }
t3rnel-kernel = { path = "../t3rnel-kernel" }
t3rnel-api = { path = "../t3rnel-api" }
t3rnel-migrate = { path = "../t3rnel-migrate" }
t3rnel-skills = { path = "../t3rnel-skills" }
t3rnel-extensions = { path = "../t3rnel-extensions" }
zeroize = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
t3rnel-runtime = { path = "../t3rnel-runtime" }
uuid = { workspace = true }
ratatui = { workspace = true }
colored = { workspace = true }
tempfile = { workspace = true }
